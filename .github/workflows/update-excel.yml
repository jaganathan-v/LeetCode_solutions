name: Update LeetCode Analytics Excel

# Runs automatically every time LeetSync pushes a new solve to main.
# concurrency below forces runs to queue one-at-a-time instead of
# overlapping, which is what was causing the push conflicts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch: {}

concurrency:
  group: leetcode-report-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (full history needed for commit stats)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Regenerate the Excel report
        run: python scripts/build_excel.py

      - name: Commit and push updated report (if it changed)
        run: |
          git config user.name "leetcode-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/LeetCode_Analytics.xlsx scripts/tag_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-update LeetCode analytics [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejected, branch moved — cleaning up and retrying ($i)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Failed to push after retries."
          exit 1
