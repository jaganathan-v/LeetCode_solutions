name: Update LeetCode Analytics Excel

# Runs automatically every time LeetSync pushes a new solve to main.
# concurrency queues overlapping runs instead of letting them race.
# On a push conflict, we don't try to git-merge the binary Excel file
# (that always fails) — we discard the stale commit, resync to the
# latest main, rebuild the report fresh, and recommit.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch: {}

concurrency:
  group: leetcode-report-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (full history needed for commit stats)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Regenerate the Excel report
        run: python scripts/build_excel.py

      - name: Commit and push updated report (rebuild fresh on conflict)
        run: |
          git config user.name "leetcode-analytics-bot"
          git config user.email "actions@users.noreply.github.com"

          commit_and_push() {
            git add reports/LeetCode_Analytics.xlsx scripts/tag_cache.json
            if git diff --cached --quiet; then
              echo "No changes to commit."
              return 0
            fi
            git commit -m "Auto-update LeetCode analytics [skip ci]"
            git push
          }

          if commit_and_push; then
            exit 0
          fi

          for i in 1 2 3 4 5; do
            echo "Push failed — resyncing and rebuilding fresh ($i)..."
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD~1 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_excel.py
            if commit_and_push; then
              exit 0
            fi
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1
